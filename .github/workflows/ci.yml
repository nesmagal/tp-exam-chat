name: CI - Build & Deploy Chat

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Backend - Install & Test
      working-directory: backend
      run: |
        npm install
        node server.js & sleep 5
        curl -f http://localhost:3000/api/messages || exit 1

    - name: Frontend - Test Build
      working-directory: frontend
      run: |
        echo "Frontend ready for deploy"

    - name: Deploy Backend to Render
      run: |
        echo "Tu peux utiliser Render CLI ou un webhook pour auto deploy"

    - name: Deploy Frontend to Vercel
      run: |
        echo "Vercel CLI peut déployer automatiquement"
