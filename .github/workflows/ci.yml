name: CI/CD Mini Chat

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Vérifier le code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Lister l’arborescence pour debug (optionnel mais conseillé)
      - name: List repo files
        run: ls -R

      # 3. Installer Docker Buildx pour les builds multi-plateformes
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 4. Build Backend Docker Image
      - name: Build Backend Image
        run: docker build -t tp-backend ./backend

      # 5. Build Frontend Docker Image
      - name: Build Frontend Image
        run: docker build -t tp-frontend ./frontend

      # 6. Lister les images Docker pour vérification
      - name: List Docker Images
        run: docker images

      # 7. (Optionnel) Tester le backend via curl
      - name: Test Backend API
        run: |
          docker run -d --name test-backend -p 3000:3000 tp-backend
          sleep 5
          curl http://localhost:3000/api/messages
          docker stop test-backend
