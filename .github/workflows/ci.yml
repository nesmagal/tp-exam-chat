name: CI/CD Mini Chat

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend + Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ---------- Backend ----------
      - name: Setup Node.js for Backend
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Backend server (optional)
        working-directory: ./backend
        run: echo "Backend build complete"

      # ---------- Frontend ----------
      - name: Build Frontend Docker image
        run: docker build -t tp-exam-chat-frontend ./frontend

      - name: Run Frontend build (optional)
        run: echo "Frontend build complete"

      # ---------- Deploy (Local Docker example) ----------
      - name: Start services with Docker Compose
        run: docker-compose up --build -d
