<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #messages { border: 1px solid #ccc; height: 300px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
    input { padding: 5px; margin-right: 5px; }
    button { padding: 5px 10px; }
  </style>
</head>
<body>
  <h2>Mini Chat</h2>
  <input id="pseudo" placeholder="Pseudo">
  <div id="messages"></div>
  <input id="content" placeholder="Message">
  <button onclick="sendMessage()">Envoyer</button>

  <script>
    // URL du backend (Docker Compose mappe le port 3000)
    const backendUrl = 'http://localhost:3000/api/messages';

    async function fetchMessages() {
      try {
        const res = await fetch(backendUrl);
        const data = await res.json();
        const messagesDiv = document.getElementById('messages');
        messagesDiv.innerHTML = data.map(m => `<b>${m.author}</b> [${new Date(m.timestamp).toLocaleTimeString()}]: ${m.content}`).join('<br>');
        messagesDiv.scrollTop = messagesDiv.scrollHeight; // scroll automatique vers le bas
      } catch (err) {
        console.error('Erreur fetch messages:', err);
      }
    }

    async function sendMessage() {
      const author = document.getElementById('pseudo').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!author || !content) return alert('Pseudo et message requis !');

      try {
        await fetch(backendUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ author, content })
        });
        document.getElementById('content').value = '';
        fetchMessages();
      } catch (err) {
        console.error('Erreur send message:', err);
      }
    }

    // Rafraîchir les messages toutes les 3 secondes
    setInterval(fetchMessages, 3000);
    fetchMessages();
  </script>
</body>
</html>
