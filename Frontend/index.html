<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    #messages {
      border: 1px solid #ccc;
      height: 300px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
    }
  </style>
</head>
<body>

  <h2>Mini Chat</h2>

  <input id="pseudo" placeholder="Pseudo" />

  <div id="messages"></div>

  <input id="content" placeholder="Message" />
  <button onclick="sendMessage()">Envoyer</button>

  <script>
    const backendUrl = "https://tp-exam-chat-1-l67x.onrender.com/api/messages";

    async function fetchMessages() {
      const res = await fetch(backendUrl);
      const data = await res.json();

      const messagesDiv = document.getElementById("messages");
      messagesDiv.innerHTML = data
        .map(
          m =>
            `<p><b>${m.author}</b> [${new Date(m.timestamp).toLocaleTimeString()}] : ${m.content}</p>`
        )
        .join("");
    }

    async function sendMessage() {
      const author = document.getElementById("pseudo").value;
      const content = document.getElementById("content").value;

      if (!author || !content) return;

      await fetch(backendUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ author, content })
      });

      document.getElementById("content").value = "";
      fetchMessages();
    }

    fetchMessages();
    setInterval(fetchMessages, 3000);
  </script>

</body>
</html>
